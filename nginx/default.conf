server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /registro-renipress-webapp {
        resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
        set $renipress_host app20.susalud.gob.pe;
        proxy_pass https://$renipress_host:8086$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name $renipress_host;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $renipress_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
        proxy_redirect https://app20.susalud.gob.pe:8086/ /;
        proxy_redirect http://app20.susalud.gob.pe:8086/ /;
        proxy_redirect http://app20.susalud.gob.pe:8080/ /;
        proxy_redirect https://app20.susalud.gob.pe:8080/ /;
        proxy_connect_timeout 8s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
